name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Tests
        run: pytest tests -q

      # The unit tests cannot catch a pipeline that no longer runs end to end.
      # This builds a deliberately tiny corpus and drives every stage through it,
      # so a broken adapter, featuriser or report writer fails the build rather
      # than being found the next time someone runs `make all` by hand.
      - name: Smoke the full pipeline
        run: python -m ringfence.cli --config configs/ci_smoke.yaml all

      - name: Leakage and honesty checks must pass
        run: python -m ringfence.cli --config configs/ci_smoke.yaml verify
